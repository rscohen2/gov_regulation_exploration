<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFPB Regulatory Language Explorer</title>
<style>
  :root {
    --bg: #F8F7F4;
    --bg-panel: #ffffff;
    --bg-aside: #f0ede6;
    --text: #1a2332;
    --text-muted: #5a6478;
    --accent: #5c7a6b;
    --accent-light: #dce8e3;
    --amber: #c4893a;
    --amber-light: #f5e8d5;
    --border: #d8d3c8;
    --border-strong: #b8b2a8;
    --obama: #4a7fa5;
    --trump1: #c4893a;
    --biden: #5c7a6b;
    --trump2: #8b5a6b;
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  header {
    background: var(--text);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    align-items: baseline;
    gap: 20px;
    border-bottom: 3px solid var(--amber);
  }

  header h1 {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: normal;
    letter-spacing: 0.01em;
  }

  header p {
    font-size: 12px;
    color: #99aabb;
    font-style: italic;
  }

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    height: calc(100vh - 61px);
  }

  /* Sidebar */
  aside {
    background: var(--bg-aside);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }

  .sidebar-section {
    margin-bottom: 8px;
  }

  .sidebar-label {
    font-family: var(--font-serif);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    padding: 8px 16px 4px;
    text-transform: uppercase;
  }

  .term-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 7px 16px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    border-left: 3px solid transparent;
    transition: background 0.1s, border-color 0.1s;
  }

  .term-btn:hover { background: var(--accent-light); }

  .term-btn.active {
    background: var(--accent-light);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: bold;
  }

  .term-btn .hit-badge {
    float: right;
    font-size: 10px;
    color: var(--text-muted);
    background: var(--border);
    padding: 1px 5px;
    border-radius: 8px;
    font-family: var(--font-sans);
  }

  /* Main panel */
  main {
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .section-title {
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    margin-bottom: 14px;
  }

  /* Hit count chart */
  .chart-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px 24px;
  }

  .chart-title {
    font-family: var(--font-serif);
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--text);
  }

  .period-bars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    align-items: end;
  }

  .period-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .bar-wrap {
    width: 100%;
    height: 120px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .bar {
    width: 60%;
    border-radius: 2px 2px 0 0;
    transition: height 0.4s ease;
    position: relative;
    cursor: pointer;
  }

  .bar:hover { opacity: 0.85; }

  .bar-label {
    font-size: 12px;
    font-weight: bold;
    color: var(--text);
    text-align: center;
  }

  .period-name {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    font-family: var(--font-serif);
    font-style: italic;
  }

  .obama-color { background: var(--obama); }
  .trump1-color { background: var(--trump1); }
  .biden-color { background: var(--biden); }
  .trump2-color { background: var(--trump2); }

  /* Neighbor panel */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .neighbor-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
  }

  .neighbor-card h3 {
    font-family: var(--font-serif);
    font-size: 13px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .neighbor-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .neighbor-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .neighbor-word {
    font-family: var(--font-mono);
    font-size: 12px;
    width: 130px;
    flex-shrink: 0;
    color: var(--text);
  }

  .neighbor-bar-wrap {
    flex: 1;
    height: 10px;
    background: var(--bg-aside);
    border-radius: 2px;
    overflow: hidden;
  }

  .neighbor-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .neighbor-count {
    font-size: 10px;
    color: var(--text-muted);
    width: 28px;
    text-align: right;
  }

  /* Drift panel */
  .drift-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px 24px;
  }

  .drift-row {
    display: grid;
    grid-template-columns: 160px 1fr 1fr;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    align-items: start;
  }

  .drift-row:last-child { border-bottom: none; }

  .drift-period {
    font-family: var(--font-serif);
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    padding-top: 2px;
  }

  .drift-words {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .drift-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 2px;
  }

  .drift-new {
    background: var(--accent-light);
    color: var(--accent);
  }

  .drift-lost {
    background: #f5e0e0;
    color: #8b3a3a;
  }

  .drift-none {
    color: var(--text-muted);
    font-style: italic;
    font-size: 11px;
    padding-top: 4px;
  }

  /* Concordance */
  .concordance-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px 24px;
  }

  .period-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
    border-bottom: 2px solid var(--border);
  }

  .period-tab {
    padding: 7px 16px;
    font-family: var(--font-serif);
    font-size: 12px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color 0.1s, border-color 0.1s;
  }

  .period-tab:hover { color: var(--text); }
  .period-tab.active { color: var(--text); border-bottom-color: var(--amber); }

  .concordance-lines {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 300px;
    overflow-y: auto;
  }

  .conc-line {
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
    padding: 10px 12px;
    background: var(--bg-aside);
    border-radius: 3px;
    border-left: 3px solid var(--border);
  }

  .conc-line .match {
    color: var(--text);
    font-weight: bold;
    background: var(--amber-light);
    padding: 1px 3px;
    border-radius: 2px;
  }

  .conc-meta {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-family: var(--font-sans);
  }

  .conc-source-cfr { border-left-color: var(--obama); }
  .conc-source-preamble { border-left-color: var(--amber); }

  .source-legend {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--text-muted);
    align-items: center;
  }

  .legend-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 1px;
    margin-right: 4px;
  }

  .empty-state {
    color: var(--text-muted);
    font-style: italic;
    font-size: 13px;
    padding: 20px 0;
    text-align: center;
  }

  /* Period color dot */
  .period-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--text-muted);
    font-style: italic;
  }
</style>
</head>
<body>

<header>
  <h1>CFPB Regulatory Language Explorer</h1>
  <p>Keyword-in-context analysis across administrations · CFR text + Federal Register preambles</p>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="loading">Loading terms…</div>
  </aside>

  <main id="main">
    <div class="loading">Select a term from the sidebar to begin.</div>
  </main>
</div>

<script>
// ── Load data ─────────────────────────────────────────────────────────────────
// The site expects kwic_results.json in the same directory.
// For GitHub Pages, commit that file alongside index.html.

const PERIODS = ["Obama", "Trump-1", "Biden", "Trump-2"];
const PERIOD_COLORS = {
  "Obama":   "#4a7fa5",
  "Trump-1": "#c4893a",
  "Biden":   "#5c7a6b",
  "Trump-2": "#8b5a6b",
};
const PERIOD_LABELS = {
  "Obama":   "Obama 2011–2017",
  "Trump-1": "Trump I 2017–2021",
  "Biden":   "Biden 2021–2025",
  "Trump-2": "Trump II 2025–",
};

let DATA = null;
let currentTerm = null;
let currentPeriod = "Obama";

async function loadData() {
  try {
    const resp = await fetch("kwic_results.json");
    if (!resp.ok) throw new Error("Not found");
    DATA = await resp.json();
    buildSidebar();
    // select first term with hits
    const first = DATA.targets.find(t =>
      PERIODS.some(p => (DATA.periods[p]?.[t]?.hit_count || 0) > 0)
    );
    if (first) selectTerm(first);
  } catch (e) {
    document.getElementById("sidebar").innerHTML =
      `<div style="padding:16px;color:#8b3a3a;font-size:12px;">
        Could not load kwic_results.json.<br><br>
        Place your <code>kwic_results.json</code> file in the same folder as this HTML file and reload.
       </div>`;
    document.getElementById("main").innerHTML =
      `<div class="loading">Waiting for data file…</div>`;
  }
}

function totalHits(term) {
  return PERIODS.reduce((s, p) =>
    s + (DATA.periods[p]?.[term]?.hit_count || 0), 0);
}

function buildSidebar() {
  const sidebar = document.getElementById("sidebar");
  const targets = DATA.targets || [];

  // group: targets with hits vs without
  const withHits = targets.filter(t => totalHits(t) > 0);
  const noHits   = targets.filter(t => totalHits(t) === 0);

  let html = "";

  // group by rough category
  const phrases = withHits.filter(t => t.includes(" "));
  const single  = withHits.filter(t => !t.includes(" "));

  if (single.length) {
    html += `<div class="sidebar-section">
      <div class="sidebar-label">Single terms</div>`;
    single.forEach(t => {
      const n = totalHits(t);
      html += `<button class="term-btn" onclick="selectTerm('${t}')" id="btn-${CSS.escape(t)}">
        ${t} <span class="hit-badge">${n}</span>
      </button>`;
    });
    html += `</div>`;
  }

  if (phrases.length) {
    html += `<div class="sidebar-section">
      <div class="sidebar-label">Phrases</div>`;
    phrases.forEach(t => {
      const n = totalHits(t);
      html += `<button class="term-btn" onclick="selectTerm('${escapeAttr(t)}')" id="btn-${CSS.escape(t)}">
        ${t} <span class="hit-badge">${n}</span>
      </button>`;
    });
    html += `</div>`;
  }

  if (noHits.length) {
    html += `<div class="sidebar-section">
      <div class="sidebar-label" style="opacity:.5">No hits</div>`;
    noHits.forEach(t => {
      html += `<button class="term-btn" style="opacity:.4;cursor:default">${t}</button>`;
    });
    html += `</div>`;
  }

  sidebar.innerHTML = html;
}

function escapeAttr(s) {
  return s.replace(/'/g, "\\'");
}

function selectTerm(term) {
  currentTerm = term;
  currentPeriod = PERIODS.find(p =>
    (DATA.periods[p]?.[term]?.hit_count || 0) > 0
  ) || "Obama";

  // update sidebar active state
  document.querySelectorAll(".term-btn").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById(`btn-${CSS.escape(term)}`);
  if (btn) btn.classList.add("active");

  renderMain();
}

function renderMain() {
  const term = currentTerm;
  const main = document.getElementById("main");

  const counts = PERIODS.map(p => DATA.periods[p]?.[term]?.hit_count || 0);
  const maxCount = Math.max(...counts, 1);

  main.innerHTML = `
    <!-- Hit count chart -->
    <div class="chart-card">
      <div class="chart-title">"${term}" — occurrences by administration</div>
      <div class="period-bars">
        ${PERIODS.map((p, i) => {
          const n = counts[i];
          const h = Math.round((n / maxCount) * 110);
          return `
          <div class="period-col">
            <div class="bar-wrap">
              <div class="bar ${p.toLowerCase().replace("-","")}-color"
                   style="height:${h}px;background:${PERIOD_COLORS[p]}"
                   title="${PERIOD_LABELS[p]}: ${n} hits">
              </div>
            </div>
            <div class="bar-label">${n}</div>
            <div class="period-name">${p}</div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <!-- Neighbors -->
    <div>
      <div class="section-title">Top neighbors (window ±10 words)</div>
      <div class="two-col">
        ${PERIODS.filter(p => (DATA.periods[p]?.[term]?.hit_count || 0) > 0)
          .map(p => renderNeighborCard(term, p)).join("")}
      </div>
    </div>

    <!-- Concordance -->
    <div class="concordance-card">
      <div class="section-title">Concordance lines</div>
      <div class="source-legend">
        <span><span class="legend-dot" style="background:#4a7fa5"></span>CFR text</span>
        <span><span class="legend-dot" style="background:#c4893a"></span>Federal Register preamble</span>
      </div>
      <div class="period-tabs">
        ${PERIODS.filter(p => (DATA.periods[p]?.[term]?.hit_count || 0) > 0)
          .map(p => `<button class="period-tab ${p === currentPeriod ? 'active' : ''}"
            onclick="switchTab('${p}')">${p}</button>`).join("")}
      </div>
      <div id="conc-lines">${renderConcordance(term, currentPeriod)}</div>
    </div>

    <!-- Neighbor drift -->
    <div class="drift-card">
      <div class="section-title">Neighbor drift between periods</div>
      ${renderDrift(term)}
    </div>
  `;
}

function renderNeighborCard(term, period) {
  const data = DATA.periods[period]?.[term];
  if (!data || !data.top_neighbors?.length) return "";

  const top = data.top_neighbors.slice(0, 12);
  const max = top[0][1];

  return `
    <div class="neighbor-card">
      <h3 style="color:${PERIOD_COLORS[period]}">
        <span class="period-dot" style="background:${PERIOD_COLORS[period]}"></span>
        ${period} &nbsp;<span style="font-weight:normal;color:var(--text-muted);font-size:11px">${data.hit_count} hits</span>
      </h3>
      <div class="neighbor-list">
        ${top.map(([w, n]) => `
          <div class="neighbor-row">
            <span class="neighbor-word">${w}</span>
            <div class="neighbor-bar-wrap">
              <div class="neighbor-bar" style="width:${Math.round(n/max*100)}%;background:${PERIOD_COLORS[period]}44;border-right:2px solid ${PERIOD_COLORS[period]}"></div>
            </div>
            <span class="neighbor-count">${n}</span>
          </div>`).join("")}
      </div>
    </div>`;
}

function switchTab(period) {
  currentPeriod = period;
  document.querySelectorAll(".period-tab").forEach(t => {
    t.classList.toggle("active", t.textContent.trim() === period);
  });
  document.getElementById("conc-lines").innerHTML =
    renderConcordance(currentTerm, period);
}

function renderConcordance(term, period) {
  const data = DATA.periods[period]?.[term];
  if (!data?.hits?.length) {
    return `<div class="empty-state">No concordance lines for this period.</div>`;
  }

  return `<div class="concordance-lines">
    ${data.hits.slice(0, 20).map(h => {
      const src = h.source === "preamble" ? "preamble" : "cfr";
      const srcLabel = src === "preamble"
        ? `preamble · ${h.doc || ""}`
        : `CFR §${h.part}`;
      return `
        <div class="conc-line conc-source-${src}">
          <div class="conc-meta">${h.date} · ${srcLabel}</div>
          …${escapeHtml(h.left)} <span class="match">${escapeHtml(h.match)}</span> ${escapeHtml(h.right)}…
        </div>`;
    }).join("")}
  </div>`;
}

function renderDrift(term) {
  // compute drift from the neighbor lists
  const activePeriods = PERIODS.filter(p =>
    (DATA.periods[p]?.[term]?.hit_count || 0) > 0
  );

  if (activePeriods.length < 2) {
    return `<div class="empty-state">Not enough periods to show drift.</div>`;
  }

  let html = "";
  for (let i = 0; i < activePeriods.length - 1; i++) {
    const prev = activePeriods[i];
    const curr = activePeriods[i + 1];
    const prevWords = new Set(
      (DATA.periods[prev]?.[term]?.top_neighbors || []).map(([w]) => w)
    );
    const currWords = new Set(
      (DATA.periods[curr]?.[term]?.top_neighbors || []).map(([w]) => w)
    );

    const newWords  = [...currWords].filter(w => !prevWords.has(w));
    const lostWords = [...prevWords].filter(w => !currWords.has(w));

    html += `
      <div class="drift-row">
        <div class="drift-period">${prev} → ${curr}</div>
        <div>
          <div style="font-size:10px;color:var(--accent);margin-bottom:4px;font-weight:600">NEW NEIGHBORS</div>
          ${newWords.length
            ? `<div class="drift-words">${newWords.slice(0,18).map(w =>
                `<span class="drift-tag drift-new">${w}</span>`).join("")}</div>`
            : `<div class="drift-none">none</div>`}
        </div>
        <div>
          <div style="font-size:10px;color:#8b3a3a;margin-bottom:4px;font-weight:600">LOST NEIGHBORS</div>
          ${lostWords.length
            ? `<div class="drift-words">${lostWords.slice(0,18).map(w =>
                `<span class="drift-tag drift-lost">${w}</span>`).join("")}</div>`
            : `<div class="drift-none">none</div>`}
        </div>
      </div>`;
  }

  return html;
}

function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

loadData();
</script>
</body>
</html>
